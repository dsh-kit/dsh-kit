<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">桌面插件的四层生命周期</title>
  <desc id="desc">Profile 已保存、Host 已加载、Client 已挂载、App 已重启。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8B94A7"/>
    </marker>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g>
      <rect x="70" y="28" width="620" height="82" rx="16" fill="#1F2430" stroke="#343B4A"/>
      <circle cx="104" cy="69" r="18" fill="#F3F4F6"/>
      <text x="104" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#0F1115">1</text>
      <text x="140" y="62" font-size="17" font-weight="700" fill="#F7F8FA">Profile 已保存</text>
      <text x="140" y="86" font-size="13" fill="#C8CEDB">依赖和 patch 已写入，下次启动会包含插件。</text>
    </g>
    <line x1="380" y1="112" x2="380" y2="139" stroke="#8B94A7" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="70" y="145" width="620" height="82" rx="16" fill="#1F2430" stroke="#343B4A"/>
      <circle cx="104" cy="186" r="18" fill="#F3F4F6"/>
      <text x="104" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#0F1115">2</text>
      <text x="140" y="179" font-size="17" font-weight="700" fill="#F7F8FA">Host 已加载</text>
      <text x="140" y="203" font-size="13" fill="#C8CEDB">工具和服务端路由存在于当前 Host 进程。</text>
    </g>
    <line x1="380" y1="229" x2="380" y2="256" stroke="#8B94A7" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="70" y="262" width="620" height="82" rx="16" fill="#1F2430" stroke="#343B4A"/>
      <circle cx="104" cy="303" r="18" fill="#F3F4F6"/>
      <text x="104" y="309" text-anchor="middle" font-size="16" font-weight="700" fill="#0F1115">3</text>
      <text x="140" y="296" font-size="17" font-weight="700" fill="#F7F8FA">Client 已挂载</text>
      <text x="140" y="320" font-size="13" fill="#C8CEDB">当前页面已经有 UI 入口和 slot。</text>
    </g>
    <line x1="380" y1="346" x2="380" y2="373" stroke="#8B94A7" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="70" y="379" width="620" height="82" rx="16" fill="#1F2430" stroke="#343B4A"/>
      <circle cx="104" cy="420" r="18" fill="#F3F4F6"/>
      <text x="104" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#0F1115">4</text>
      <text x="140" y="413" font-size="17" font-weight="700" fill="#F7F8FA">App 已重启</text>
      <text x="140" y="437" font-size="13" fill="#C8CEDB">Electron 进程和原生菜单状态被替换。</text>
    </g>
    <text x="70" y="500" font-size="12" fill="#8B94A7">一次“卸载”动作会穿过全部四层。</text>
  </g>
</svg>

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm Trusted Publishing exchanges this for a short-lived token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        run: |
          VERSION="$(node -p "require('./packages/create-dsh-kit/package.json').version")"
          test "v$VERSION" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match version $VERSION"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: pnpm check
      - run: pnpm pack:check
      - name: Generate and verify a project from the package
        run: |
          node packages/create-dsh-kit/index.mjs /tmp/dsh-release-check --name dsh-release-check --author ci --yes
          cd /tmp/dsh-release-check
          pnpm install
          pnpm verify
      - name: Publish
        working-directory: packages/create-dsh-kit
        run: |
          case "$VERSION" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=/tmp/release-notes.md
          awk -v v="$VERSION" 'BEGIN { found = 0 } /^## / { if (found) exit; if (index($0, "## " v) == 1) found = 1 } found' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then printf '## Changes\n\nSee CHANGELOG.md.\n' > "$NOTES"; fi
          printf '\n**npm:** https://www.npmjs.com/package/create-dsh-kit/v/%s\n\n```bash\nnpm create dsh-kit@latest my-plugin\n```\n' "$VERSION" >> "$NOTES"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            case "$VERSION" in
              *-*) gh release create "$GITHUB_REF_NAME" --title "dsh-kit v$VERSION" --notes-file "$NOTES" --prerelease ;;
              *) gh release create "$GITHUB_REF_NAME" --title "dsh-kit v$VERSION" --notes-file "$NOTES" ;;
            esac
          fi
